[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifesim"
version = "0.1.0"
description = "Offline, explainable agent-based artificial-life simulation observatory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
visuals = ["matplotlib>=3.7"]

[project.scripts]
lifesim = "lifesim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lifesim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "longrun: multi-day or performance-oriented simulation acceptance test",
  "benchmark: optional larger performance benchmark (not part of the default smoke suite)",
]
